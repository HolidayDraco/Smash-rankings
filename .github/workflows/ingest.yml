# Scheduled data ingest. Sync runs every 2 hours (hourly Friday to Monday), backfill runs
# nightly, and rate runs after either one succeeds. Discover has no trigger of its own:
# the first sync of the day runs it. One shared queue (concurrency group "ingest", never
# cancelling a running job) means runs never overlap. Cron minutes are off the hour.
name: Ingest

on:
  schedule:
    # Sync: even hours every day, plus odd hours Fri-Mon (so weekends are hourly, no double runs).
    # The odd-hour sync at 07:23 is left out to protect the backfill: a running 07:23 sync would make the
    # 07:41 backfill wait, and the 08:23 sync would then replace the waiting backfill (GitHub keeps only
    # one waiting run per concurrency group). Once the discover cap is raised and backfill runs long, the
    # 08:23/09:23 syncs can queue behind it and one may be replaced (see docs/startgg-notes.md).
    # Keep in step with CRON_MONITORS in jobs/src/sentry.ts (schedule, and timeout-minutes as maxRuntime).
    - cron: "23 */2 * * *"
    - cron: "23 1-5/2,9-23/2 * * 5,6,0,1"
    # Backfill (resumes from its checkpoint each night).
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: >-
          Which job to run. sync = fetch new results (what the schedule does).
          backfill = load past months of history (set "months" below).
          rate = recompute the rankings only.
        type: choice
        options: [sync, backfill, rate]
        default: sync
      months:
        description: >-
          Backfill only: how many months back, 1 to 24 (empty means 12).
          Leave it empty for sync and rate, or the run stops with an error.
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      job: ${{ steps.which.outputs.job }}
    steps:
      - name: Pick the job
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.job }}
          MONTHS: ${{ inputs.months }}
        run: |
          if [ "$SCHEDULE" = "41 7 * * *" ]; then job=backfill
          elif [ -n "$REQUESTED" ]; then job="$REQUESTED"
          else job=sync; fi
          # "months" only means something to backfill: fail loudly instead of silently ignoring it.
          if [ -n "$MONTHS" ] && [ "$job" != "backfill" ]; then
            message="\"months\" is only used by backfill, but job is \"$job\". Run again with job = backfill, or leave months empty."
            echo "::error::$message"
            echo "Ingest: $message Nothing ran." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$MONTHS" ] && ! [[ "$MONTHS" =~ ^[0-9]+$ && "$MONTHS" -ge 1 && "$MONTHS" -le 24 ]]; then
            message="\"months\" must be a whole number from 1 to 24 (got \"$MONTHS\")."
            echo "::error::$message"
            echo "Ingest: $message Nothing ran." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Check the secrets exist
        id: secrets
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$STARTGG_TOKEN" ] && [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Ingest: not configured yet (add the STARTGG_TOKEN and DATABASE_URL Actions secrets). Nothing ran." >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    name: Sync
    needs: check
    if: needs.check.outputs.configured == 'true' && needs.check.outputs.job == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations (creates the tables on first run; safe to repeat)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Sync (runs discover first if it has not succeeded in 24 h)
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: error reports and missed-run alerts (docs/monitoring.md). Off when unset.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_CRONS: ${{ vars.SENTRY_CRONS }}
        run: pnpm job:sync -- --time-budget-minutes 40

  backfill:
    name: Backfill
    needs: check
    if: needs.check.outputs.configured == 'true' && needs.check.outputs.job == 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations (creates the tables on first run; safe to repeat)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Backfill (75 minute budget, its own discover cap, resumes next run)
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: error reports and missed-run alerts (docs/monitoring.md). Off when unset.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_CRONS: ${{ vars.SENTRY_CRONS }}
          MONTHS: ${{ inputs.months }}
        run: pnpm job:backfill -- --months "${MONTHS:-12}"

  rate:
    name: Rate
    needs: [check, sync, backfill]
    # Runs after a sync or backfill that succeeded (a run that stopped at its time budget
    # exits cleanly, so it counts), or on its own when asked for by hand.
    if: >-
      !cancelled() && needs.check.outputs.configured == 'true' &&
      (needs.check.outputs.job == 'rate' ||
      needs.sync.result == 'success' || needs.backfill.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations (creates the tables on first run; safe to repeat)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Rate (also writes the top 20 and database size to the summary)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: error reports and missed-run alerts (docs/monitoring.md). Off when unset.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_CRONS: ${{ vars.SENTRY_CRONS }}
          # The full recompute peaks around 2.5 GB at ~50k players / 1M sets; runners have 16 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm job:rate

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable Postgres for packages/db integration tests. Throwaway
      # credentials that exist only inside this CI job (not a secret).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sr_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the API bundle and check it loads
        # Dummy URL: the bundle only validates it at import; nothing connects.
        run: |
          pnpm --filter @sr/api build
          DATABASE_URL=postgres://u:p@localhost:5432/x node -e "import('./apps/api/api/index.js').then(async (m) => { if (typeof m.GET !== 'function') process.exit(1); const r = await m.GET(new Request('http://localhost/')); if (r.status !== 200) process.exit(1); })"

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Disposable Postgres seeded with synthetic players for the leaderboard tests.
      # Throwaway credentials that exist only inside this CI job (not a secret).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sr_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sr_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (CI only)
        run: pnpm --filter @sr/e2e exec playwright install --with-deps chromium
      - name: Migrate and seed the throwaway database
        run: |
          pnpm db:migrate
          pnpm db:seed
      # `pnpm e2e` builds the web app pointed at the API on :8787, and Playwright starts that API.
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
